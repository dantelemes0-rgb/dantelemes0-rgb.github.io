<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conexão concluída · Novela Quiz Studio</title>
<style>
:root{color-scheme:dark;--bg:#07080e;--text:#f5f2ff;--muted:#a8a3b8;--gold:#d4b26a;--green:#34d399}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 0%,rgba(139,92,246,.18),transparent 40%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,"Segoe UI",sans-serif}
.card{width:min(460px,calc(100% - 40px));padding:34px;border:1px solid rgba(255,255,255,.1);border-radius:20px;background:rgba(14,16,25,.9);text-align:center}
.mark{width:52px;height:52px;margin:0 auto 18px;border:1px solid rgba(212,178,106,.5);border-radius:14px;display:grid;place-items:center;color:var(--gold);font-weight:800;background:rgba(212,178,106,.08)}
h1{font-size:22px;margin:0 0 8px}p{color:var(--muted);font-size:14px;line-height:1.6;margin:0}
.status{margin:18px 0 0;padding:12px;border-radius:10px;background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.25);color:var(--green);font-size:13px}
a{display:inline-block;margin-top:22px;color:#15110a;background:var(--gold);text-decoration:none;font-weight:700;font-size:13px;padding:11px 16px;border-radius:10px}
</style></head>
<body><div class="card">
<div class="mark">NQ</div>
<h1 id="title">Conta TikTok conectada</h1>
<p id="message">A autorização foi concluída. Você já pode voltar ao estúdio para revisar seus quizzes e enviar rascunhos.</p>
<div class="status" id="status">Conexão oficial via OAuth</div>
<a href="/">Voltar ao site</a>
</div>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var account = params.get('account');
  if (params.get('tiktok') === 'error') {
    document.getElementById('title').textContent = 'Não foi possível conectar';
    document.getElementById('message').textContent = params.get('message') || 'Tente novamente pelo estúdio.';
    document.getElementById('status').textContent = 'Falha na autorização';
  } else if (account) {
    document.getElementById('status').textContent = 'Conta conectada: @' + account;
  }
})();
</script>
</body></html>
