<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conectando ao TikTok · Novela Quiz Studio</title>
<style>
:root{color-scheme:dark;--bg:#07080e;--text:#f5f2ff;--muted:#a8a3b8;--gold:#d4b26a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 0%,rgba(139,92,246,.18),transparent 40%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,"Segoe UI",sans-serif}
.card{width:min(440px,calc(100% - 40px));padding:34px;border:1px solid rgba(255,255,255,.1);border-radius:20px;background:rgba(14,16,25,.9);text-align:center}
.mark{width:52px;height:52px;margin:0 auto 18px;border:1px solid rgba(212,178,106,.5);border-radius:14px;display:grid;place-items:center;color:var(--gold);font-weight:800;background:rgba(212,178,106,.08)}
h1{font-size:22px;margin:0 0 8px}p{color:var(--muted);font-size:14px;line-height:1.6;margin:0}
.spinner{width:30px;height:30px;margin:24px auto 0;border:2px solid rgba(255,255,255,.12);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
a{color:var(--gold)}
</style></head>
<body><div class="card">
<div class="mark">NQ</div>
<h1 id="title">Conectando sua conta TikTok</h1>
<p id="message">Aguarde enquanto concluímos a autorização com segurança.</p>
<div class="spinner" id="spinner"></div>
</div>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var title = document.getElementById('title');
  var message = document.getElementById('message');
  var spinner = document.getElementById('spinner');
  if (params.get('error')) {
    spinner.style.display = 'none';
    title.textContent = 'Não foi possível conectar';
    message.textContent = params.get('error_description') || params.get('error');
    return;
  }
  if (!params.get('code') || !params.get('state')) {
    spinner.style.display = 'none';
    title.textContent = 'Retorno incompleto';
    message.textContent = 'O TikTok não enviou o código de autorização. Volte ao estúdio e tente novamente.';
    return;
  }
  var backend = 'https://searches-health-would-chapter.trycloudflare.com';
  window.location.replace(backend + '/api/publishing/tiktok/callback?' + params.toString());
})();
</script>
</body></html>
